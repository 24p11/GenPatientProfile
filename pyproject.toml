[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "GenPatientProfile"
version = "0.1.0"
description = "Génération de profils patients et de scénarios cliniques synthétiques"
readme = "README.md"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
license = "CC-BY-NC-SA-4.0"
authors = [
    { name = "Arthur LAMARD", email = "arthur.lamard@chu-brest.fr" },
    { name = "Basile FUCHS", email = "basile.fuchs@chu-brest.fr" },
    { name = "Claire DECHAUX", email = "claire.dechaux@inria.fr" },
    { name = "Remi FLICOTEAUX", email = "remi.flicoteaux@aphp.fr" },
]
dependencies = [
    "numpy>=2.4.4,<3.0.0",
    "polars>=1.40.1,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "tqdm>=4.67.3,<5.0.0",
]
[project.urls]
Homepage = "https://github.com/24p11/GenPatientProfile"
Repository = "https://github.com/24p11/GenPatientProfile"
Issues = "https://github.com/24p11/GenPatientProfile/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]
[tool.setuptools.packages.find]
include = ["genpatientprofile*"]
exclude = ["data*", "scenarios*", "reports*"]
[tool.setuptools.package-data]
"genpatientprofile.sites.aphp" = [
    "templates/*.yaml",
    "templates/*.yml",
    "templates/**/*.txt",
    "templates/**/*.yaml",
    "templates/**/*.yml",
]
